<text text-anchor="middle" x="278.5" y="-112.8" font-family="Courier,monospace" font-size="14.00" fill="#ff0090">THE CATCH&#45;22:</text>
<text text-anchor="middle" x="278.5" y="-97.8" font-family="Courier,monospace" font-size="14.00" fill="#ff0090">you cannot know which split fits</text>
<text text-anchor="middle" x="278.5" y="-82.8" font-family="Courier,monospace" font-size="14.00" fill="#ff0090">without first trying (and failing)</text>
<text text-anchor="middle" x="278.5" y="-67.8" font-family="Courier,monospace" font-size="14.00" fill="#ff0090">the ones that don&#39;t.</text>
<text text-anchor="middle" x="278.5" y="-52.8" font-family="Courier,monospace" font-size="14.00" fill="#ff0090">Every cold load of this model</text>
<text text-anchor="middle" x="278.5" y="-37.8" font-family="Courier,monospace" font-size="14.00" fill="#ff0090">replays ~3 failed probes</text>
<text text-anchor="middle" x="278.5" y="-22.8" font-family="Courier,monospace" font-size="14.00" fill="#ff0090">before success — by design,</text>
<text text-anchor="middle" x="278.5" y="-7.8" font-family="Courier,monospace" font-size="14.00" fill="#ff0090">not by bug.</text>
</g>
