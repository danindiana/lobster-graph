<text text-anchor="middle" x="309" y="-97.8" font-family="Courier,monospace" font-size="14.00" fill="#00ffff">Model size alone doesn&#39;t predict OOM —</text>
<text text-anchor="middle" x="309" y="-82.8" font-family="Courier,monospace" font-size="14.00" fill="#00ffff">gemma4:26b (17G) never failed once.</text>
<text text-anchor="middle" x="309" y="-67.8" font-family="Courier,monospace" font-size="14.00" fill="#00ffff">What&#39;s different about nemotron3:33b:</text>
<text text-anchor="middle" x="309" y="-52.8" font-family="Courier,monospace" font-size="14.00" fill="#00ffff">it&#39;s the only model whose weights (27G)</text>
<text text-anchor="middle" x="309" y="-37.8" font-family="Courier,monospace" font-size="14.00" fill="#00ffff">exceed combined VRAM (26.5G) outright,</text>
<text text-anchor="middle" x="309" y="-22.8" font-family="Courier,monospace" font-size="14.00" fill="#00ffff">forcing every load through the</text>
<text text-anchor="middle" x="309" y="-7.8" font-family="Courier,monospace" font-size="14.00" fill="#00ffff">CPU/GPU split&#45;search in diagram 04.</text>
