<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lobster Graph — CosmosGL Dashboard</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #101014; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #graph { position: fixed; inset: 0; }
  #hud { position: fixed; top: 16px; left: 16px; color: #e9ecef; z-index: 10; pointer-events: none; }
  #hud h1 { font-size: 15px; margin: 0 0 4px 0; font-weight: 600; letter-spacing: 0.02em; }
  #status { font-size: 12px; color: #adb5bd; }
  #legend { position: fixed; bottom: 16px; left: 16px; z-index: 10; color: #e9ecef; font-size: 12px; background: rgba(20,20,24,0.6); border-radius: 8px; padding: 10px 12px; }
  .legend-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #tooltip { position: fixed; display: none; z-index: 20; background: rgba(20,20,24,0.92); color: #f1f3f5; font-size: 12px; padding: 6px 10px; border-radius: 6px; pointer-events: none; max-width: 320px; }
  #links { position: fixed; top: 16px; right: 16px; z-index: 10; font-size: 12px; }
  #links a { color: #74c0fc; text-decoration: none; }
  #hint { position: fixed; top: 44px; right: 16px; z-index: 10; font-size: 11px; color: #6c757d; }

  #modal { display: none; position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,0.55); align-items: center; justify-content: center; }
  #modal-panel { position: relative; width: min(720px, 90vw); max-height: 82vh; overflow-y: auto; background: #17171c; color: #e9ecef; border-radius: 10px; padding: 24px 28px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
  #modal-close { position: absolute; top: 12px; right: 16px; cursor: pointer; font-size: 20px; color: #adb5bd; background: none; border: none; line-height: 1; }
  #modal-close:hover { color: #f1f3f5; }
  .detail-header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; padding-right: 24px; }
  .detail-type { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
  .detail-header h2 { font-size: 18px; margin: 0; }
  .pdf-button { margin-left: auto; font-size: 12px; color: #101014; background: #74c0fc; padding: 5px 10px; border-radius: 6px; text-decoration: none; font-weight: 600; }
  .pdf-button:hover { background: #a5d8ff; }
  .detail-field { margin-bottom: 14px; }
  .detail-field h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #868e96; margin: 0 0 4px 0; }
  .detail-field p { font-size: 13px; line-height: 1.5; margin: 0; white-space: pre-wrap; word-break: break-word; }
  .detail-field pre { font-size: 12px; line-height: 1.5; margin: 0; white-space: pre-wrap; word-break: break-word; background: #101014; padding: 10px 12px; border-radius: 6px; max-height: 300px; overflow-y: auto; }
</style>
</head>
<body>
  <div id="graph"></div>
  <div id="hud">
    <h1>🌌 Lobster Graph — CosmosGL</h1>
    <div id="status">Loading…</div>
  </div>
  <div id="links"><a href="http://localhost:8585/">← webgl.html dashboard (port 8585)</a></div>
  <div id="hint">Double-click a node for details / source PDF</div>
  <div id="legend"></div>
  <div id="tooltip"></div>

  <div id="modal">
    <div id="modal-panel">
      <button id="modal-close" aria-label="Close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="cosmos_bundle.js"></script>
</body>
</html>
