name: Feature Request
description: Propose a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or limitation you're hitting.
      placeholder: "Processing 1000+ papers takes too long because sections run sequentially."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the pipeline does this affect?
      options:
        - Python pipeline (paper_processor.py)
        - Rust TUI wizard (wizard/)
        - Setup script (setup_paper_processor.sh)
        - Output format / diagrams
        - Model routing / GPU utilisation
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
      placeholder: "Add a --batch-workers flag to process N papers in parallel using separate Ollama contexts."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about (optional).

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Hardware specs, model preferences, example use case, etc.
